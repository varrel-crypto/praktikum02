<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
</head>
<body>
  <h1>Thank You</h1>

  <p>
   Terima kasih telah memesan!. 
   Kami telah menerima informasi berikut tentang pesanan Anda:
  </p>

  <h2>Your Information</h2>
  <div class="info">
    <strong>Nama Produk:</strong> <span id="name"></span><br>
    <strong>Deskripsi:</strong> <span id="description"></span><br>
    <strong>Nomor Akun:</strong> <span id="Account no"></span><br>
    <strong>Tipe Pembayaran:</strong> <span id="payment_type"></span><br>
    <strong>Pengguna Akun:</strong> <span id="account_holder"></span><br>
    <strong>Nomor Telepon :</strong> <span id="phone"></span><br>
    <strong>Email:</strong> <span id="email"></span>
  </div>

  <footer>Halaman ini hanya untuk tujuan pendidikan. Tidak ada produk yang akan dikirim.</footer>

  <script>
    const params = new URLSearchParams(window.location.search);

    function show(id, value) {
      // textContent supaya input user tidak dieksekusi sebagai HTML
      document.getElementById(id).textContent = value || "-";
    }

    show("name", params.get("name"));
    show("description", params.get("description"));
    show("Account no", params.get("Account no"));
    show("payment_type", params.get("payment_type"));
    show("account_holder", params.get("account_holder"));
    show("phone", params.get("phone"));
    show("email", params.get("email"));
  </script>
</body>
</html>
